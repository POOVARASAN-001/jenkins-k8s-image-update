
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-update-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: image-update-app
  template:
    metadata:
      labels:
        app: image-update-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.26
          ports:
            - containerPort: 80
